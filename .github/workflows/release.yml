name: Build & release

# Every push builds both packages. Pushes to main also publish a GitHub release with
# store-screenshots.zip (full) and store-screenshots-lite.zip (< 20 MB, for claude.ai / ChatGPT).
# Version: major.minor from .claude-plugin/plugin.json, patch = workflow run number (v1.0.<run>).
# Add "[skip release]" to a commit message to build without publishing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core tesseract-ocr tesseract-ocr-tur
          python -m pip install --quiet pillow fonttools resvg-py

      - name: Smoke test
        run: python tools/smoke_test.py

      - name: Build packages
        run: python tools/package_skill.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(python -c "import json;v=json.load(open('.claude-plugin/plugin.json'))['version'].split('.');print(v[0]+'.'+v[1])")
          TAG="v${BASE}.${GITHUB_RUN_NUMBER}"
          FULL=$(du -h dist/store-screenshots.zip | cut -f1)
          LITE=$(du -h dist/store-screenshots-lite.zip | cut -f1)
          {
            echo "Automatic build of \`${GITHUB_SHA::7}\`."
            echo
            echo "| File | Size | Use for |"
            echo "|---|---|---|"
            echo "| \`store-screenshots-lite.zip\` | ${LITE} | claude.ai and ChatGPT uploads (< 20 MB) |"
            echo "| \`store-screenshots.zip\` | ${FULL} | Claude Code, Codex, Cursor, Gemini CLI (all library images) |"
            echo
            echo "### Changes"
            git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By:/d;/^Claude-Session:/d'
          } > notes.md
          gh release create "$TAG" dist/store-screenshots-lite.zip dist/store-screenshots.zip \
            --title "Store Screenshots ${TAG}" --notes-file notes.md --target "$GITHUB_SHA" --latest
